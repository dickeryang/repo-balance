# 依赖自动升级：Rust / 前端 / GitHub Actions 三条链路
# 许可证与已知漏洞由 ci.yml 的 supply-chain job（cargo-deny）持续把关。
version: 2
updates:
  # Rust workspace（根 Cargo.toml 为 workspace 根）
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    # 补丁级更新合并为一个 PR，减少噪音；小版本/大版本单独评审
    groups:
      cargo-patch:
        patterns: ["*"]
        update-types: ["patch"]

  # 前端（Vite / Vue / Element Plus 等）
  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      npm-patch:
        patterns: ["*"]
        update-types: ["patch"]

  # 工作流自身用的 action 版本
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci(deps)"
    labels:
      - dependencies
