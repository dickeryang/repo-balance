[workspace]
resolver = "2"
members = ["crates/rb-core", "crates/rb-app"]

exclude = ["demo-repo"]

[workspace.package]
version = "0.1.0"
edition = "2021"
# MSRV：依赖树中最高声明（darling / plist / time 等为 1.88），
# 由 cargo metadata 实测得出，勿凭印象下调。
rust-version = "1.88"
license = "Apache-2.0"
authors = ["repo-balance contributors"]

[workspace.dependencies]
# `https` 必须显式开启：git2 0.21 的 default 为空，缺省编译出的 libgit2 不带
# 任何 TLS 后端，HTTPS 克隆会报 "there is no TLS stream available"（远程仓库
# 体检直接失败）。各平台后端：macOS = SecureTransport、Windows = WinHTTP、
# Linux = 系统 OpenSSL（CI 已装 libssl-dev）。
git2 = { version = "0.21", default-features = false, features = ["https"] }
rayon = "1.10"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tempfile = "3"
tauri = "2"
tauri-plugin-dialog = "2"
tauri-build = "2"

[profile.release]
lto = "thin"
