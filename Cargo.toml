[workspace]
resolver = "2"
members = ["crates/rb-core", "crates/rb-app"]
exclude = ["demo-repo"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["repo-balance contributors"]

[workspace.dependencies]
git2 = { version = "0.19", default-features = false, features = ["https"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"

[profile.release]
lto = "thin"
