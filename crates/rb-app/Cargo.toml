[package]
name = "rb-app"
description = "仓衡 Tauri 2 壳"
version.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[features]
# 启用后 tauri 走 custom-protocol（内嵌前端资源）；未启用时编译为 dev 模式，
# 前端改从 devUrl 加载（需 vite dev server 在 5173 运行），直接跑二进制会白屏。
# `cargo tauri build` 会自动启用；纯 cargo release 构建必须显式加 --features custom-protocol。
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
rb-core = { path = "../rb-core" }
tempfile.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
tokio = { version = "1", features = ["sync"] }
